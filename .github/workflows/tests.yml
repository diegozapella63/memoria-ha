name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  visual:
    name: Visuais (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the preview in the repository (built with cd frontend && npm run build); Node for the server of the report
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: tests/visual.sh "${{ runner.temp }}/capturas"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: ${{ runner.temp }}/capturas
          retention-days: 7

  # os arquivos que são iguais nos apps da família (tools/iguais.py): baixa os outros apps e compara
  iguais:
    name: Arquivos iguais aos dos outros apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: memoria-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/gerencia-ha
          path: gerencia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/inventario-ha
          path: inventario-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/economia-ha
          path: economia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/CorrerIA-ha
          path: correria-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/resolvia-ha
          path: resolvia-ha
      - uses: actions/checkout@v4
        with:
          repository: diegozapella63/cronologia-ha
          path: cronologia-ha
      - run: python3 memoria-ha/tools/iguais.py --exigir
