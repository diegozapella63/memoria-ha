# https://developers.home-assistant.io/docs/apps/configuration
name: MemorIA
version: "1.1.0"
slug: memoria
description: Blocos de anotações em forma de caderno, que se abrem sozinhos conforme o período e o horário do dia.
url: "https://github.com/diegozapella63/memoria-ha/tree/main/memoria"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-heart-outline
panel_title: MemorIA
panel_admin: false
homeassistant_api: true
# Photos are handed to Home Assistant's AI Task through the media folder
# (media/memoria/ia-temp) while the AI reads them, then deleted.
map:
  - media:rw
