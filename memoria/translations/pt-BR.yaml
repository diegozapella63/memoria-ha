configuration:
  gemini_api_key:
    name: Chave da API do Gemini (opcional)
    description: >-
      Só é necessária se o Home Assistant não tiver o AI Task configurado.
      Usada para ler mensagens coladas e fotos de anotações.
  gemini_model:
    name: Modelo do Gemini
    description: Modelo usado com a chave acima.
